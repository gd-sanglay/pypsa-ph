name: pypsa-ph
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pypsa=0.34.1
  - linopy=0.4.4
  - numpy=1.26.4        # numpy < 2 required by this PyPSA/linopy combination
  - pandas=2.2.3
  - xarray=2024.7.0
  - geopandas=1.0.1
  - shapely=2.0
  - pyproj
  - openpyxl
  - netcdf4
  - highspy=1.9.0       # open-source solver
  # Optional, for large runs (requires a licence):
  # - gurobi::gurobi=11.0.3
